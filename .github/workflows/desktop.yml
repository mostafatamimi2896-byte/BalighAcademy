name: desktop
on:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Build
        run: dotnet build desktop\BalighDesktop.csproj -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: BalighDesktop
          path: desktop\bin\Release\net48\
